name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe behavior, not only appearance.
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options: [Windows, macOS, Linux, All platforms]
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Security and privacy considerations
      description: Note permissions, network calls, stored data, and confirmation requirements.
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement or test this feature.
