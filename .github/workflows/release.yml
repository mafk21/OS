name: Release packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/cross-platform.yml

  package:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install release validation tooling
        run: python -m pip install --upgrade pip pytest
      - name: Verify checkout contains no forbidden private files
        run: python -m pytest tests/test_repository_privacy.py -q
      - name: Build clean source packages
        run: python tools/build_release.py --version "${GITHUB_REF_NAME}"
      - name: Create draft release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/*
          --draft
          --verify-tag
          --title "JARVIS ${GITHUB_REF_NAME}"
          --generate-notes
