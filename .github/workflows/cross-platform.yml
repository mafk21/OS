name: Cross-platform regression
on:
  workflow_call:
  # Pull requests run the matrix once. Direct pushes run only after landing on
  # main, avoiding duplicate branch-push + pull-request jobs for the same SHA.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cross-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  publication-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apex_ui/package-lock.json
      - run: python -m pip install --upgrade pip pytest pip-audit bandit
      - run: python -m pip_audit -r requirements.txt
      - run: bandit -r core actions memory dashboard main.py ui.py -q -lll -iii --exclude '*/tests/*'
      - run: python -m pytest tests/test_repository_privacy.py -q
      - run: npm ci --ignore-scripts --no-fund
        working-directory: apex_ui
      - run: npm audit --audit-level=low
        working-directory: apex_ui

  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      JARVIS_HUD_NO_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Native Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libgl1 libegl1 libxkbcommon-x11-0
      - run: python -m pip install --upgrade pip
      - name: Install actual OS-filtered application requirements
        run: python -m pip install -r requirements.txt pytest pytest-asyncio pytest-github-actions-annotate-failures
      - run: python install_jarvis.py --check
      - name: Compile application modules
        run: python -m compileall -q main.py ui.py install_jarvis.py core actions memory plugins
      - name: Platform, startup, security, and desktop routing regressions
        run: python -m pytest tests/test_cross_platform_runtime.py tests/test_device_management.py tests/test_startup_config_contract.py tests/test_security_vault_portals.py tests/test_companion_os_voice_parity.py -q --disable-warnings
  hud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apex_ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apex_ui
      - run: npx tsc --noEmit
        working-directory: apex_ui
      - run: npm run build
        working-directory: apex_ui
